<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: {{background}};
          color: {{textColor}};
          font-family: "Inter", system-ui, sans-serif;
        }
        .edg-stack {
          position: absolute;
          left: 12%;
          right: 12%;
          top: 0;
          bottom: {{@safeBottom}}px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        .edg-rule {
          width: 100%;
          height: 2px;
          background: {{textColor}};
          transform-origin: center center;
        }
        .edg-logo {
          width: 420px;
          height: 300px;
          object-fit: contain;
          margin: 64px 0;
        }
        .edg-tagline {
          margin-top: 56px;
          font-family: "Playfair Display", Georgia, serif;
          font-style: italic;
          font-weight: 400;
          font-size: 60px;
          line-height: 1.2;
          text-align: center;
          text-wrap: balance;
        }
        .edg-tagline[data-empty="true"] {
          display: none;
        }
        .edg-dot {
          width: 18px;
          height: 18px;
          border-radius: 50%;
          background: {{accent}};
          margin-top: 40px;
        }
        @media (min-aspect-ratio: 1/1) {
          .edg-stack {
            left: 25%;
            right: 25%;
          }
          .edg-logo {
            width: 340px;
            height: 220px;
            margin: 40px 0;
          }
          .edg-tagline {
            margin-top: 36px;
            font-size: 52px;
          }
        }
      </style>

      <div id="root" data-composition-id="{{@id}}" data-width="{{@width}}" data-height="{{@height}}">
        <div id="{{@id}}-stack" class="edg-stack">
          <div id="{{@id}}-rule-top" class="edg-rule" data-label="Filet haut"></div>
          <img id="{{@id}}-logo" class="edg-logo" src="{{logo}}" alt="" data-label="Logo" />
          <div id="{{@id}}-rule-bottom" class="edg-rule" data-label="Filet bas"></div>
          <p id="{{@id}}-tagline" class="edg-tagline" data-label="Signature">{{tagline}}</p>
          <div id="{{@id}}-dot" class="edg-dot" data-label="Point d'accent"></div>
        </div>
      </div>

      <script>
        (function () {
          const duration = {{@duration}};
          const tagline = document.getElementById("{{@id}}-tagline");
          const hasTagline = tagline && tagline.textContent.trim();
          if (!hasTagline) tagline.setAttribute("data-empty", "true");
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#{{@id}}-rule-top", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 0);
          tl.fromTo("#{{@id}}-rule-bottom", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 0);
          tl.fromTo("#{{@id}}-logo", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, 0.25);
          if (hasTagline) tl.fromTo("#{{@id}}-tagline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.6);
          tl.fromTo("#{{@id}}-dot", { scale: 0 }, { scale: 1, duration: 0.5, ease: "power3.out" }, 0.9);
          tl.fromTo("#{{@id}}-logo", { scale: 1 }, { scale: 1.03, duration: Math.max(0.1, duration - 1.15), ease: "none", immediateRender: false }, 1.15);
          tl.to({}, { duration: duration }, 0);
          window.__timelines["{{@id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
