<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: {{background}};
          color: {{textColor}};
          font-family: system-ui, sans-serif;
        }
        .ts-stack {
          position: absolute;
          left: 9%;
          right: 9%;
          top: 0;
          bottom: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 36px;
        }
        .ts-kicker {
          display: inline-block;
          align-self: flex-start;
          padding: 12px 22px;
          border-radius: 999px;
          background: {{textColor}};
          color: {{background}};
          font-size: 34px;
          font-weight: 800;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }
        .ts-kicker:empty {
          display: none;
        }
        .ts-title {
          font-size: 96px;
          line-height: 1.06;
          font-weight: 850;
          letter-spacing: -0.03em;
        }
        .ts-rule {
          width: 120px;
          height: 8px;
          border-radius: 4px;
          background: {{accent}};
          transform-origin: left center;
        }
        .ts-subtitle {
          font-size: 46px;
          line-height: 1.3;
          font-weight: 500;
          opacity: 0.82;
        }
      </style>

      <div id="root" data-composition-id="{{@id}}" data-width="{{@width}}" data-height="{{@height}}">
        <div class="ts-stack">
          <p id="{{@id}}-kicker" class="ts-kicker" data-label="Sur-titre">{{kicker}}</p>
          <h2 id="{{@id}}-title" class="ts-title" data-label="Titre">{{title}}</h2>
          <div id="{{@id}}-rule" class="ts-rule" data-label="Filet"></div>
          <p id="{{@id}}-subtitle" class="ts-subtitle" data-label="Sous-titre">{{subtitle}}</p>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#{{@id}}-kicker", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0);
          tl.fromTo("#{{@id}}-title", { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.65, ease: "power4.out" }, 0.12);
          tl.fromTo("#{{@id}}-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.45);
          tl.fromTo("#{{@id}}-subtitle", { opacity: 0, y: 28 }, { opacity: 0.82, y: 0, duration: 0.6, ease: "power3.out" }, 0.6);
          window.__timelines["{{@id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
