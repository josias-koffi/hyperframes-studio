<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: {{background}};
          color: {{textColor}};
          font-family: "Inter", system-ui, sans-serif;
        }
        .edc-stack {
          position: absolute;
          left: 9%;
          right: 9%;
          top: 0;
          bottom: {{@safeBottom}}px;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .edc-mask {
          overflow: hidden;
          padding-bottom: 0.08em;
        }
        .edc-headline {
          font-family: "Playfair Display", Georgia, serif;
          font-size: 120px;
          line-height: 1.02;
          font-weight: 900;
          letter-spacing: -0.02em;
          text-wrap: balance;
        }
        .edc-rule {
          width: 120px;
          height: 4px;
          background: {{accent}};
          transform-origin: left center;
          margin: 56px 0;
        }
        .edc-button {
          align-self: flex-start;
          display: flex;
          align-items: center;
          gap: 28px;
          padding: 30px 44px;
          border: 3px solid {{textColor}};
          font-size: 40px;
          font-weight: 700;
          letter-spacing: 0.16em;
          text-transform: uppercase;
        }
        .edc-arrow {
          color: {{accent}};
          font-size: 48px;
          letter-spacing: 0;
        }
        .edc-link {
          margin-top: 36px;
          font-size: 32px;
          font-weight: 500;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          opacity: 0.7;
        }
        .edc-link[data-empty="true"] {
          display: none;
        }
        .edc-logo {
          position: absolute;
          left: 9%;
          bottom: calc({{@safeBottom}}px + 7%);
          width: 220px;
          height: 110px;
          object-fit: contain;
          object-position: left center;
        }
        .edc-logo[data-empty="true"] {
          display: none;
        }
        @media (min-aspect-ratio: 1/1) {
          .edc-headline {
            font-size: 104px;
          }
          .edc-rule {
            margin: 36px 0;
          }
          .edc-logo {
            left: auto;
            right: 9%;
            bottom: calc({{@safeBottom}}px + 9%);
            object-position: right center;
          }
        }
      </style>

      <div id="root" data-composition-id="{{@id}}" data-width="{{@width}}" data-height="{{@height}}">
        <div id="{{@id}}-stack" class="edc-stack">
          <div class="edc-mask">
            <h2 id="{{@id}}-headline" class="edc-headline" data-label="Titre de fin">{{headline}}</h2>
          </div>
          <div id="{{@id}}-rule" class="edc-rule" data-label="Filet d'accent"></div>
          <div id="{{@id}}-button" class="edc-button" data-label="Bouton">
            <span id="{{@id}}-action" data-label="Texte du bouton">{{action}}</span><span id="{{@id}}-arrow" class="edc-arrow" data-label="Flèche">→</span>
          </div>
          <p id="{{@id}}-link" class="edc-link" data-label="Lien">{{link}}</p>
        </div>
        <img id="{{@id}}-logo" class="edc-logo" src="{{logo}}" alt="" data-label="Logo" />
      </div>

      <script>
        (function () {
          const duration = {{@duration}};
          const logo = document.getElementById("{{@id}}-logo");
          const hasLogo = logo && logo.getAttribute("src");
          if (!hasLogo) logo.setAttribute("data-empty", "true");
          const link = document.getElementById("{{@id}}-link");
          const hasLink = link && link.textContent.trim();
          if (!hasLink) link.setAttribute("data-empty", "true");
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#{{@id}}-headline", { yPercent: 105 }, { yPercent: 0, duration: 0.9, ease: "expo.out" }, 0);
          tl.fromTo("#{{@id}}-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.35);
          tl.fromTo("#{{@id}}-button", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.6);
          if (hasLink) tl.fromTo("#{{@id}}-link", { opacity: 0 }, { opacity: 0.7, duration: 0.6, ease: "power2.out" }, 0.9);
          if (hasLogo) tl.fromTo("#{{@id}}-logo", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 1);
          // The arrow nudges forward, then back, while the viewer decides.
          tl.to("#{{@id}}-arrow", { x: 14, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.3);
          tl.to({}, { duration: duration }, 0);
          window.__timelines["{{@id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
