<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: {{background}};
          color: {{textColor}};
          font-family: "Inter", system-ui, sans-serif;
        }
        .edl-stack {
          position: absolute;
          left: 9%;
          right: 9%;
          top: 24px;
          bottom: calc({{@safeBottom}}px + 24px);
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .edl-mask {
          overflow: hidden;
          padding-bottom: 0.08em;
          margin-bottom: 56px;
        }
        .edl-title {
          font-family: "Playfair Display", Georgia, serif;
          font-size: 92px;
          line-height: 1.05;
          font-weight: 900;
          letter-spacing: -0.02em;
          text-wrap: balance;
        }
        .edl-rule {
          height: 2px;
          background: {{textColor}};
          opacity: 0.85;
          transform-origin: left center;
        }
        .edl-item {
          display: flex;
          align-items: baseline;
          gap: 40px;
          padding: 40px 0;
        }
        .edl-item[data-empty="true"],
        .edl-rule[data-empty="true"] {
          display: none;
        }
        .edl-number {
          flex: none;
          width: 110px;
          font-family: "Playfair Display", Georgia, serif;
          font-style: italic;
          font-weight: 400;
          font-size: 76px;
          line-height: 1;
          color: {{accent}};
        }
        .edl-text {
          font-size: 50px;
          line-height: 1.2;
          font-weight: 500;
          text-wrap: balance;
        }
        @media (min-aspect-ratio: 1/1) {
          .edl-title {
            font-size: 80px;
          }
          .edl-mask {
            margin-bottom: 32px;
          }
          .edl-item {
            padding: 24px 0;
          }
          .edl-text {
            font-size: 42px;
          }
        }
      </style>

      <div id="root" data-composition-id="{{@id}}" data-width="{{@width}}" data-height="{{@height}}">
        <div id="{{@id}}-stack" class="edl-stack">
          <div class="edl-mask">
            <h2 id="{{@id}}-title" class="edl-title" data-label="Titre">{{title}}</h2>
          </div>
          <div id="{{@id}}-rule0" class="edl-rule" data-label="Filet"></div>
          <div id="{{@id}}-item1" class="edl-item">
            <span id="{{@id}}-number1" class="edl-number" data-label="Numéro 1">01</span>
            <p id="{{@id}}-text1" class="edl-text" data-label="Point 1">{{item1}}</p>
          </div>
          <div id="{{@id}}-rule1" class="edl-rule" data-label="Filet 1"></div>
          <div id="{{@id}}-item2" class="edl-item">
            <span id="{{@id}}-number2" class="edl-number" data-label="Numéro 2">02</span>
            <p id="{{@id}}-text2" class="edl-text" data-label="Point 2">{{item2}}</p>
          </div>
          <div id="{{@id}}-rule2" class="edl-rule" data-label="Filet 2"></div>
          <div id="{{@id}}-item3" class="edl-item">
            <span id="{{@id}}-number3" class="edl-number" data-label="Numéro 3">03</span>
            <p id="{{@id}}-text3" class="edl-text" data-label="Point 3">{{item3}}</p>
          </div>
          <div id="{{@id}}-rule3" class="edl-rule" data-label="Filet 3"></div>
        </div>
      </div>

      <script>
        (function () {
          const duration = {{@duration}};
          const third = document.getElementById("{{@id}}-text3");
          const count = third && third.textContent.trim() ? 3 : 2;
          if (count === 2) {
            document.getElementById("{{@id}}-item3").setAttribute("data-empty", "true");
            document.getElementById("{{@id}}-rule3").setAttribute("data-empty", "true");
          }
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#{{@id}}-title", { yPercent: 105 }, { yPercent: 0, duration: 0.9, ease: "expo.out" }, 0);
          tl.fromTo("#{{@id}}-rule0", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 0.3);
          // The points come in over the first half of the scene, each closed by its own rule.
          const step = Math.min(0.7, (duration * 0.5) / count);
          for (let i = 1; i <= count; i++) {
            const at = 0.6 + (i - 1) * step;
            tl.fromTo("#{{@id}}-number" + i, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at);
            tl.fromTo("#{{@id}}-text" + i, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" }, at + 0.08);
            tl.fromTo("#{{@id}}-rule" + i, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, at + 0.15);
          }
          tl.fromTo("#{{@id}}-stack", { y: 0 }, { y: -16, duration: duration, ease: "none", immediateRender: false }, 0);
          tl.to({}, { duration: duration }, 0);
          window.__timelines["{{@id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
