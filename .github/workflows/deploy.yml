name: Deploy

# Deployed by the josias-koffi/infra platform. No rule lives here: which branch
# deploys which environment, and whether a push is enough or a manual run is
# needed, come from .deploy/manifest.yaml (environments.<env>.branch / deploy).
#
#   manual run : Actions → Deploy → Run workflow, from the environment's branch;
#                image_tag to promote / roll back to an existing tag;
#                plan_only to only show the plan.
#
# Repo variables : DOKPLOY_URL, TF_STATE_BUCKET
# Repo secrets   : DOKPLOY_API_KEY, R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#                  CF_API_TOKEN + CF_ZONE_ID (dns: cloudflare, the default)
# Env secrets    : the names listed in the manifest (infra/scripts/init-app-env.sh).

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (empty: the one of this branch)"
        required: false
        type: string
      image_tag:
        description: "Existing image tag to deploy (short sha). Empty: build this commit."
        required: false
        type: string
      plan_only:
        description: "Only show the plan"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  OWNER: josias-koffi

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  resolve:
    uses: josias-koffi/infra/.github/workflows/resolve.yml@main
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}

  build:
    name: Build & push ${{ matrix.service }}
    if: needs.resolve.outputs.build == 'true'
    needs: [check, resolve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: studio-web
            dockerfile: docker/web.Dockerfile
          - service: studio-api
            dockerfile: docker/api.Dockerfile
          - service: studio-claude-runner
            dockerfile: docker/claude-runner.Dockerfile
          - service: studio-render-worker
            dockerfile: docker/render-worker.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=,format=short
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:cache,mode=max

  deploy:
    needs: [resolve, build]
    if: ${{ !failure() && !cancelled() && needs.resolve.outputs.deploy == 'true' }}
    uses: josias-koffi/infra/.github/workflows/deploy.yml@main
    with:
      environment: ${{ needs.resolve.outputs.environment }}
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      plan_only: ${{ inputs.plan_only == true }}
    secrets: inherit
