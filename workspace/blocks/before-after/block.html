<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: {{background}};
          color: {{textColor}};
          font-family: system-ui, sans-serif;
        }
        .ba-grid {
          position: absolute;
          left: 7%;
          right: 7%;
          top: 12%;
          bottom: max(12%, calc({{@safeBottom}}px + 32px));
          display: flex;
          flex-direction: column;
          gap: 48px;
        }
        @media (min-aspect-ratio: 1/1) {
          .ba-grid {
            flex-direction: row;
            top: 18%;
            bottom: max(18%, calc({{@safeBottom}}px + 32px));
          }
        }
        .ba-panel {
          position: relative;
          flex: 1;
          border-radius: 36px;
          padding: 64px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 28px;
        }
        .ba-before {
          background: rgba(0, 0, 0, 0.06);
          border: 4px dashed rgba(0, 0, 0, 0.22);
        }
        .ba-after {
          background: {{accent}};
        }
        .ba-label {
          align-self: flex-start;
          padding: 10px 26px;
          border-radius: 999px;
          font-size: 36px;
          font-weight: 800;
          letter-spacing: 0.06em;
          text-transform: uppercase;
        }
        .ba-before .ba-label {
          background: {{textColor}};
          color: {{background}};
        }
        .ba-after .ba-label {
          background: rgba(0, 0, 0, 0.82);
          color: #ffffff;
        }
        .ba-text {
          font-size: 66px;
          line-height: 1.14;
          font-weight: 800;
          letter-spacing: -0.02em;
          text-wrap: balance;
        }
        .ba-before .ba-text {
          text-decoration-line: line-through;
          text-decoration-thickness: 0.09em;
          text-decoration-color: transparent;
        }
      </style>

      <div id="root" data-composition-id="{{@id}}" data-width="{{@width}}" data-height="{{@height}}">
        <div class="ba-grid">
          <div id="{{@id}}-before" class="ba-panel ba-before" data-label="Panneau avant">
            <p id="{{@id}}-before-label" class="ba-label" data-label="Étiquette avant">{{beforeLabel}}</p>
            <p id="{{@id}}-before-text" class="ba-text" data-label="Texte avant">{{before}}</p>
          </div>
          <div id="{{@id}}-after" class="ba-panel ba-after" data-label="Panneau après">
            <p id="{{@id}}-after-label" class="ba-label" data-label="Étiquette après">{{afterLabel}}</p>
            <p id="{{@id}}-after-text" class="ba-text" data-label="Texte après">{{after}}</p>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const duration = {{@duration}};
          // The text after the change: black or white, whichever reads best on the accent panel.
          const luminance = (hex) => {
            const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
            return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
          };
          const accent = luminance("{{accent}}");
          const afterText = document.getElementById("{{@id}}-after-text");
          if (afterText) afterText.style.color = 1.05 / (accent + 0.05) >= (accent + 0.05) / 0.05 ? "#FFFFFF" : "#000000";
          const reveal = Math.min(1.8, duration * 0.4);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#{{@id}}-before", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0);
          tl.fromTo("#{{@id}}-before-text", { textDecorationColor: "rgba(0, 0, 0, 0)" }, { textDecorationColor: "{{textColor}}", duration: 0.35, ease: "power2.out" }, reveal - 0.6);
          tl.to("#{{@id}}-before", { opacity: 0.55, duration: 0.4, ease: "power2.out" }, reveal - 0.2);
          tl.fromTo("#{{@id}}-after", { opacity: 0, y: 80, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, reveal);
          tl.fromTo("#{{@id}}-after-text", { y: 0 }, { y: -10, duration: Math.max(0.1, duration - reveal - 0.6), ease: "sine.inOut", immediateRender: false }, reveal + 0.6);
          tl.to({}, { duration: duration }, 0);
          window.__timelines["{{@id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
