# yaml-language-server: $schema=https://raw.githubusercontent.com/josias-koffi/infra/main/schema/manifest.v1.json
# HyperFrames Studio — deployed by the josias-koffi/infra platform: one Dokploy project `studio`,
# environments production (main, manual) and staging (develop, auto). Mode services: one Dokploy
# service per component.
#
# The `workspace` volume (<volumePrefix>_workspace) is mounted by api, claude-runner and
# render-worker: the three images run as uid 1000. `claude_sessions` keeps the Claude Code session
# transcripts so a checkpoint can resume (`claude --resume`) after a redeploy; `agent_homes` holds one home per
# client agent uid (OpenCode sessions, npm cache): each client's agent runs under its own uid (sandbox.ts).
#
# Sized for vps20 (6 vCPU, 11.7 GB shared with other apps, about 4.6 GB free), from a measured run (one 60 s
# video, brief to MP4): one generation at a time peaks at 1.7 GB (its OpenCode server and Chrome), one render at
# 1.3 GB and up to every core for the encode; the rest stays under 250 MB each, hf-studio more when its Chrome
# shoots thumbnails. Raise AGENT_CONCURRENCY only with about 1.7 GB more per job, RENDER_CONCURRENCY with 1.3 GB more.
#
# TODO (lot 0): replace <domaine>; check the internal hostname of the `minio` app from the workers
# (S3_ENDPOINT) — otherwise point it at the public domain.
apiVersion: deploy/v1
name: studio
description: HyperFrames Studio — projets vidéo, templates, génération Claude, publication Postiz
server: vps20

secrets:
  - HF_STUDIO_TOKEN
  - DB_PASSWORD
  - CACHE_PASSWORD
  - MINIO_ROOT_USER
  - MINIO_ROOT_PASSWORD
  - CLAUDE_CODE_OAUTH_TOKEN
  - OPENROUTER_API_KEY
  - AUTH_SESSION_SECRET
  - SMTP_USER
  - SMTP_PASSWORD
  - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
optionalSecrets:
  - POSTIZ_API_KEY

vars:
  WORKSPACE_DIR: /workspace
  S3_ENDPOINT: 'http://${app}${env == "production" ? "" : "-${env}"}-minio:9000'
  S3_PUBLIC_ENDPOINT: 'https://${domains.files}'
  S3_BUCKET: studio
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  TTS_MODEL: mistralai/voxtral-mini-tts-2603
  TTS_VOICE: fr_marie_neutral
  TTS_PEAK_DB: "-1"
  MUSIC_MODEL: google/lyria-3-clip-preview
  # Passwordless sign-in: the e-mailed link is redeemed through the web app, which holds the session cookie.
  AUTH_COOKIE_NAME: framesmith_session
  AUTH_MAGIC_LINK_TTL_MINUTES: "15"
  AUTH_SESSION_TTL_DAYS: "7"
  # Same Resend account and sender domain as cvforge.
  SMTP_PROVIDER: resend
  SMTP_SERVER: smtp.resend.com
  SMTP_PORT: "587"
  EMAIL_FROM: Framesmith <no-reply@koklo.dev>

apps:
  web:
    image: ghcr.io/josias-koffi/studio-web
    port: 3000
    domain: web
    uses: [api]               # injects API_URL=https://<api domain>
    secrets: [NEXT_SERVER_ACTIONS_ENCRYPTION_KEY]
    resources: { cpus: 0.5, memory: 512m }
  api:
    image: ghcr.io/josias-koffi/studio-api
    port: 3333
    domain: api
    healthcheck: /health
    uses: [db, cache]
    volumes: { workspace: /workspace }
    vars:
      WEB_URL: 'https://${domains.web}'
      HF_STUDIO_URL: 'http://${app}${env == "production" ? "" : "-${env}"}-hf-studio:3000'
    secrets: [DB_PASSWORD, CACHE_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, POSTIZ_API_KEY, HF_STUDIO_TOKEN, AUTH_SESSION_SECRET, SMTP_USER, SMTP_PASSWORD]
    resources: { cpus: 1, memory: 512m }
  # HyperFrames engine behind the Framesmith editor (apps/hf-studio): preview, file mutations, thumbnails of every
  # project the API opens, in process. Internal only: the browser reaches it through the API (/creations/<id>/engine).
  hf-studio:
    image: ghcr.io/josias-koffi/studio-hf-studio
    port: 3000
    volumes: { workspace: /workspace }
    secrets: [HF_STUDIO_TOKEN]
    resources: { cpus: 1, memory: 1536m }
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    port: 9000
    domain: files
    command: minio
    args: [server, /data]
    volumes: { data: /data }
    secrets: [MINIO_ROOT_USER, MINIO_ROOT_PASSWORD]
    resources: { cpus: 0.5, memory: 512m }

workers:
  claude-runner:
    image: ghcr.io/josias-koffi/studio-claude-runner
    uses: [db, cache]
    volumes: { workspace: /workspace, claude_sessions: /home/node/.claude/projects, agent_homes: /agents }
    vars: { AGENT_CONCURRENCY: "1", OPENCODE_IDLE_MS: "60000" }
    secrets: [DB_PASSWORD, CACHE_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, CLAUDE_CODE_OAUTH_TOKEN, OPENROUTER_API_KEY]
    resources: { cpus: 2, memory: 2560m }
  render-worker:
    image: ghcr.io/josias-koffi/studio-render-worker
    uses: [db, cache]
    volumes: { workspace: /workspace }
    vars: { RENDER_CONCURRENCY: "1" }
    secrets: [DB_PASSWORD, CACHE_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD]
    resources: { cpus: 2, memory: 2g }

databases:
  db: { type: postgres, version: 16-alpine, database: studio, user: studio }
caches:
  cache: { type: redis, version: 7-alpine }

environments:
  production:
    branch: main
    deploy: manual
    domains: { web: studio.<domaine>, api: studio-api.<domaine>, files: studio-files.<domaine> }
  staging:
    branch: develop
    domains: { web: studio-staging.<domaine>, api: studio-api-staging.<domaine>, files: studio-files-staging.<domaine> }
    # Staging shares the Claude subscription quota with production: no Claude jobs by default, and never the
    # Claude Code backend. Turning jobs on here bills OpenRouter: give staging its own capped key first.
    vars: { CLAUDE_JOBS_ENABLED: "false", CLAUDE_CODE_ENABLED: "false", EMAIL_FROM: "Framesmith staging <no-reply@koklo.dev>" }
