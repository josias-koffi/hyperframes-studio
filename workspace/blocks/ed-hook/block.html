<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: {{background}};
          color: {{textColor}};
          font-family: "Inter", system-ui, sans-serif;
        }
        .edh-stack {
          position: absolute;
          left: 9%;
          right: 9%;
          top: 24px;
          bottom: calc({{@safeBottom}}px + 24px);
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .edh-rule {
          height: 3px;
          background: {{textColor}};
          transform-origin: left center;
          margin-bottom: 56px;
        }
        .edh-mask {
          overflow: hidden;
          padding-bottom: 0.06em;
        }
        .edh-line {
          display: block;
          font-family: "Playfair Display", Georgia, serif;
          font-size: 136px;
          line-height: 1.02;
          font-weight: 900;
          letter-spacing: -0.02em;
          text-wrap: balance;
        }
        .edh-highlight {
          font-weight: 400;
          font-style: italic;
          color: {{accent}};
          margin-top: 12px;
        }
        .edh-highlight-wrap[data-empty="true"] {
          display: none;
        }
        .edh-dot {
          width: 22px;
          height: 22px;
          border-radius: 50%;
          background: {{accent}};
          margin-top: 64px;
        }
        @media (min-aspect-ratio: 1/1) {
          .edh-line {
            font-size: 112px;
          }
          .edh-rule {
            margin-bottom: 40px;
          }
          .edh-dot {
            margin-top: 40px;
          }
        }
      </style>

      <div id="root" data-composition-id="{{@id}}" data-width="{{@width}}" data-height="{{@height}}">
        <div id="{{@id}}-stack" class="edh-stack">
          <div id="{{@id}}-rule" class="edh-rule" data-label="Filet"></div>
          <div class="edh-mask">
            <p id="{{@id}}-text" class="edh-line" data-label="Accroche">{{text}}</p>
          </div>
          <div id="{{@id}}-highlight-wrap" class="edh-mask edh-highlight-wrap">
            <p id="{{@id}}-highlight" class="edh-line edh-highlight" data-label="Mise en avant">{{highlight}}</p>
          </div>
          <div id="{{@id}}-dot" class="edh-dot" data-label="Point d'accent"></div>
        </div>
      </div>

      <script>
        (function () {
          const duration = {{@duration}};
          const highlight = document.getElementById("{{@id}}-highlight");
          const hasHighlight = highlight && highlight.textContent.trim();
          if (!hasHighlight) document.getElementById("{{@id}}-highlight-wrap").setAttribute("data-empty", "true");
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#{{@id}}-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 0);
          tl.fromTo("#{{@id}}-text", { yPercent: 105 }, { yPercent: 0, duration: 0.9, ease: "expo.out" }, 0.15);
          if (hasHighlight) tl.fromTo("#{{@id}}-highlight", { yPercent: 105 }, { yPercent: 0, duration: 0.9, ease: "expo.out" }, 0.45);
          tl.fromTo("#{{@id}}-dot", { scale: 0 }, { scale: 1, duration: 0.5, ease: "power3.out" }, 0.8);
          // A slow rise keeps the page alive while it is read.
          tl.fromTo("#{{@id}}-stack", { y: 0 }, { y: -18, duration: duration, ease: "none", immediateRender: false }, 0);
          tl.to({}, { duration: duration }, 0);
          window.__timelines["{{@id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
