<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: {{background}};
          color: {{textColor}};
          font-family: system-ui, sans-serif;
          display: flex;
          flex-direction: column;
        }
        #root[data-layout="text-first"] {
          flex-direction: column-reverse;
        }
        @media (min-aspect-ratio: 1/1) {
          #root {
            flex-direction: row;
          }
          #root[data-layout="text-first"] {
            flex-direction: row-reverse;
          }
        }
        /* Stacked, the image gives up part of its height when the bottom is kept for the subtitles. */
        .ms-media {
          position: relative;
          flex: 0 0 calc(55% - {{@safeBottom}}px * 0.6);
          overflow: hidden;
        }
        @media (min-aspect-ratio: 1/1) {
          .ms-media {
            flex-basis: 55%;
          }
        }
        .ms-image {
          position: absolute;
          left: -4%;
          top: -4%;
          width: 108%;
          height: 108%;
          object-fit: cover;
        }
        .ms-copy {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 28px;
          padding: 0 8% {{@safeBottom}}px;
        }
        .ms-rule {
          width: 96px;
          height: 10px;
          border-radius: 5px;
          background: {{accent}};
          transform-origin: left center;
        }
        .ms-title {
          font-size: 80px;
          line-height: 1.06;
          font-weight: 900;
          letter-spacing: -0.03em;
          text-wrap: balance;
        }
        .ms-text {
          font-size: 46px;
          line-height: 1.3;
          font-weight: 500;
          text-wrap: pretty;
        }
        .ms-text:empty {
          display: none;
        }
      </style>

      <div id="root" data-composition-id="{{@id}}" data-width="{{@width}}" data-height="{{@height}}" data-layout="{{layout}}">
        <div id="{{@id}}-media" class="ms-media">
          <img id="{{@id}}-image" class="ms-image" src="{{src}}" alt="" data-label="Image" data-layout-allow-overflow />
        </div>
        <div id="{{@id}}-copy" class="ms-copy">
          <div id="{{@id}}-rule" class="ms-rule" data-label="Filet"></div>
          <h2 id="{{@id}}-title" class="ms-title" data-label="Titre">{{title}}</h2>
          <p id="{{@id}}-text" class="ms-text" data-label="Texte">{{text}}</p>
        </div>
      </div>

      <script>
        (function () {
          const duration = {{@duration}};
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#{{@id}}-media", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.7, ease: "power3.inOut" }, 0);
          tl.fromTo("#{{@id}}-image", { scale: 1.12 }, { scale: 1, duration: duration, ease: "power1.out" }, 0);
          tl.fromTo("#{{@id}}-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.45);
          tl.fromTo("#{{@id}}-title", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.5);
          tl.fromTo("#{{@id}}-text", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.75);
          tl.to({}, { duration: duration }, 0);
          window.__timelines["{{@id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
