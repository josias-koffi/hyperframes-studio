<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: {{background}};
          color: {{textColor}};
          font-family: "Inter", system-ui, sans-serif;
        }
        .eds-stack {
          position: absolute;
          left: 9%;
          right: 9%;
          top: 24px;
          bottom: calc({{@safeBottom}}px + 24px);
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .eds-figure {
          display: flex;
          align-items: baseline;
          white-space: nowrap;
          font-family: "Playfair Display", Georgia, serif;
          line-height: 0.95;
        }
        .eds-number,
        .eds-prefix {
          font-size: 360px;
          font-weight: 900;
          letter-spacing: -0.04em;
        }
        .eds-suffix {
          font-size: 200px;
          font-weight: 400;
          font-style: italic;
          color: {{accent}};
          margin-left: 12px;
        }
        .eds-rule {
          height: 3px;
          background: {{textColor}};
          transform-origin: left center;
          margin: 48px 0 40px;
        }
        .eds-label {
          font-size: 50px;
          line-height: 1.3;
          font-weight: 500;
          text-wrap: balance;
        }
        @media (min-aspect-ratio: 1/1) {
          .eds-number,
          .eds-prefix {
            font-size: 300px;
          }
          .eds-suffix {
            font-size: 160px;
          }
          .eds-label {
            font-size: 42px;
            max-width: 70%;
          }
          .eds-rule {
            margin: 32px 0 28px;
          }
        }
      </style>

      <div id="root" data-composition-id="{{@id}}" data-width="{{@width}}" data-height="{{@height}}">
        <div id="{{@id}}-stack" class="eds-stack">
          <div id="{{@id}}-figure" class="eds-figure" data-label="Chiffre">
            <span id="{{@id}}-prefix" class="eds-prefix" data-label="Préfixe">{{prefix}}</span><span id="{{@id}}-number" class="eds-number" data-label="Nombre">{{value}}</span><span id="{{@id}}-suffix" class="eds-suffix" data-label="Unité">{{suffix}}</span>
          </div>
          <div id="{{@id}}-rule" class="eds-rule" data-label="Filet"></div>
          <p id="{{@id}}-label" class="eds-label" data-label="Légende">{{label}}</p>
        </div>
      </div>

      <script>
        (function () {
          const duration = {{@duration}};
          const el = document.getElementById("{{@id}}-number");
          const raw = el ? el.textContent.trim() : "";
          // "1 200", "4,9" or "87": counted from zero, written back the way it was given.
          const decimalMark = raw.includes(",") ? "," : ".";
          const clean = raw.replace(/[\s  ]/g, "").replace(",", ".");
          const target = /^\d+(\.\d+)?$/.test(clean) ? Number(clean) : null;
          const decimals = target === null || !clean.includes(".") ? 0 : clean.split(".")[1].length;
          const grouped = /\d[\s  ]\d{3}/.test(raw);
          const format = (n) => {
            let text = n.toFixed(decimals);
            let [whole, part] = text.split(".");
            if (grouped) whole = whole.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            return part ? whole + decimalMark + part : whole;
          };
          // A long number shrinks to the width of the frame, measured once at its final value.
          const figure = document.getElementById("{{@id}}-figure");
          if (figure && el) {
            if (target !== null) el.textContent = format(target);
            const room = figure.parentElement.clientWidth;
            if (figure.scrollWidth > room) {
              const ratio = room / figure.scrollWidth;
              figure.querySelectorAll("span").forEach((span) => {
                span.style.fontSize = parseFloat(getComputedStyle(span).fontSize) * ratio + "px";
              });
            }
          }
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#{{@id}}-figure", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 0);
          if (target !== null && el) {
            const counter = { value: 0 };
            tl.fromTo(
              counter,
              { value: 0 },
              {
                value: target,
                duration: Math.min(1.6, duration * 0.5),
                ease: "power3.out",
                onUpdate: () => {
                  el.textContent = format(counter.value);
                },
              },
              0.2,
            );
          }
          tl.fromTo("#{{@id}}-suffix", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.5);
          tl.fromTo("#{{@id}}-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 0.6);
          tl.fromTo("#{{@id}}-label", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.9);
          tl.fromTo("#{{@id}}-stack", { y: 0 }, { y: -16, duration: duration, ease: "none", immediateRender: false }, 0);
          tl.to({}, { duration: duration }, 0);
          window.__timelines["{{@id}}"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
